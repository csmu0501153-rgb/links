<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean & Yvonne</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --paper:  #EDEAE3;
  --card:   #F7F5F0;
  --ink:    #24211C;
  --rust:   #B5573C;
  --slate:  #3E5C6B;
  --ochre:  #C99B3F;
  --moss:   #6E7F63;
  --line:   #24211C;
  --grey:   #8B857C;
}

html, body { height: 100%; }

body {
  font-family: 'Poppins', 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  padding: clamp(24px, 6vw, 48px) clamp(14px, 4vw, 24px) clamp(40px, 8vw, 64px);
  -webkit-font-smoothing: antialiased;
}

/* subtle grid texture */
body::before {
  content:''; position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(26,26,24,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,26,24,0.028) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}

.wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: min(380px, 100%);
  border: 2px solid var(--line);
  background: var(--card);
  animation: rise 0.5s cubic-bezier(.22,.9,.36,1) both;
}
@keyframes rise {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── HEADER BAND ── */
.band {
  display: flex; height: 10px;
  border-bottom: 2px solid var(--line);
}
.band span { flex: 1; }
.band .b1 { background: var(--rust); }
.band .b2 { background: var(--ochre); }
.band .b3 { background: var(--slate); }
.band .b4 { background: var(--moss); }

/* ── PROFILE ── */
.profile {
  padding: clamp(20px, 5vw, 28px) clamp(18px, 5vw, 24px) clamp(18px, 4.5vw, 24px);
  border-bottom: 2px solid var(--line);
  display: flex; gap: 16px; align-items: center;
}
.avatar {
  width: clamp(56px, 15vw, 68px); height: clamp(56px, 15vw, 68px); flex-shrink: 0;
  border: 2px solid var(--line);
  overflow: hidden; border-radius: 0;
}
.avatar img, .avatar svg { width:100%; height:100%; object-fit:cover; display:block; }

.p-text {}
.p-name {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(17px, 4.6vw, 21px); font-weight: 800;
  letter-spacing: -0.03em; color: var(--ink);
  line-height: 1.1; text-transform: uppercase;
}
.p-bio {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: clamp(11px, 2.9vw, 12.5px); font-weight: 300;
  color: var(--grey); line-height: 1.6; margin-top: 7px;
}


/* ── LINK ROWS ── */
.rows { }

.row {
  display: flex; align-items: stretch;
  border: none;
  border-bottom: 2px solid var(--line);
  text-decoration: none;
  cursor: pointer;
  background: transparent;
  width: 100%;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  appearance: none;
  -webkit-appearance: none;
  box-sizing: border-box;
  transition: background 0.14s;
}
.row:last-child { border-bottom: none; }
.row:hover { background: rgba(26,26,24,0.045); }
.row:active { background: rgba(26,26,24,0.09); }

.row-swatch {
  width: clamp(40px, 11vw, 48px); flex-shrink: 0;
  border-right: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
}
.sw-red    { background: var(--rust); }
.sw-blue   { background: var(--slate); }
.sw-yellow { background: var(--ochre); }
.sw-sage   { background: var(--moss); }
.sw-ink    { background: var(--ink); }

.row-swatch svg { width: 16px; height: 16px; }

.row-main {
  flex: 1; padding: clamp(12px, 3.4vw, 16px) clamp(13px, 3.6vw, 18px); min-width: 0;
  display: flex; flex-direction: column; justify-content: center;
  text-align: left;
}
.row-title {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: clamp(12.5px, 3.4vw, 14.5px); font-weight: 500;
  color: var(--ink); letter-spacing: 0.01em; line-height: 1.3;
}
.row-sub {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(8.5px, 2.2vw, 9.5px); font-weight: 500; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--grey); margin-top: 3px;
}

.row-arrow {
  width: clamp(38px, 10vw, 44px); flex-shrink: 0;
  border-left: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--ink);
  transition: transform 0.16s;
}
.row:hover .row-arrow { transform: translateX(2px); }

/* ── FOOTER ── */
.foot {
  border-top: 2px solid var(--line);
  padding: 13px 24px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--grey);
  background: #EDEAE3;
}
.foot-dots { display: flex; gap: 4px; }
.foot-dots i { width: 7px; height: 7px; display: block; border: 1px solid var(--line); }
.fd1 { background: var(--rust); }
.fd2 { background: var(--ochre); }
.fd3 { background: var(--slate); }

/* ══ MODAL ══ */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(26,26,24,0.45);
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
  width: 100%; max-width: 460px;
  background: #F7F5F0;
  border: 2px solid var(--line);
  border-bottom: none;
  max-height: 92svh; overflow-y: auto;
  animation: sheetUp 0.28s cubic-bezier(.22,.9,.36,1) both;
}
@keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

.sheet-band { display:flex; height:8px; border-bottom:2px solid var(--line); }
.sheet-band span { flex:1; }

.sheet-header {
  padding: 16px 22px 14px;
  border-bottom: 2px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.sheet-title {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: clamp(15px, 4vw, 18px); font-weight: 700; color: var(--ink);
  letter-spacing: 0.01em;
}
.sheet-close {
  width: 28px; height: 28px;
  background: transparent; border: 2px solid var(--line);
  color: var(--ink); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.14s; font-family: 'Poppins', sans-serif;
  line-height: 1;
}
.sheet-close:hover { background: var(--ink); color: #F7F5F0; }

.sheet-body { padding: clamp(18px,4.5vw,24px) clamp(18px,4.5vw,24px) clamp(36px,8vw,48px); }

.form-desc {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 12.5px; font-weight: 300; color: var(--grey);
  line-height: 1.72; margin-bottom: 20px;
  border-left: 3px solid var(--ink); padding-left: 12px;
}
.form-row { margin-bottom: 13px; }
.form-label {
  font-family: 'Poppins', sans-serif;
  font-size: 9px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink);
  display: block; margin-bottom: 6px;
}
.form-input {
  width: 100%; padding: clamp(11px,3vw,13px) clamp(12px,3.2vw,15px);
  border: 2px solid var(--line);
  background: #fff;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: clamp(14px, 3.6vw, 15px); font-weight: 400;
  color: var(--ink); outline: none;
  border-radius: 0; appearance: none;
  transition: border-color 0.14s;
}
.form-input:focus { border-color: var(--slate); }
.form-input::placeholder { color: rgba(26,26,24,0.22); }
textarea.form-input { resize: vertical; min-height: 78px; line-height: 1.6; }

.submit-btn {
  width: 100%; margin-top: 10px;
  background: var(--ink); color: #F7F5F0;
  border: 2px solid var(--line); padding: 13px;
  font-family: 'Poppins', sans-serif;
  font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer; border-radius: 0;
  transition: background 0.14s, color 0.14s;
}
.submit-btn:hover { background: var(--rust); border-color: var(--rust); }
.submit-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.form-note {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px; color: var(--grey); margin-top: 10px;
  text-align: center; line-height: 1.6; font-weight: 300;
}

.sheet-success {
  display: none; margin-top: 16px; padding: 18px;
  border: 2px solid var(--line);
  background: rgba(122,155,126,0.10);
}
.s-icon { font-size: 22px; display:block; margin-bottom:9px; }
.s-title {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 15px; font-weight: 700; color: var(--ink);
  display:block; margin-bottom:8px;
}
.s-body {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 12.5px; color: var(--grey); margin-bottom:12px;
  font-weight:300; line-height:1.72;
}
.s-yt-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 11px 15px;
  background: var(--rust); border: 2px solid var(--line);
  color: #F7F5F0; font-family: 'Poppins', sans-serif;
  font-size: 11px; font-weight: 700; text-decoration: none;
  letter-spacing: 0.1em; text-transform: uppercase;
  transition: background 0.14s;
}
.s-yt-btn:hover { background: #96432E; }
.s-note {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10.5px; color: var(--grey);
  margin-top:10px; text-align:center; line-height:1.5; font-weight:300;
}
.sheet-error {
  display: none; margin-top:10px; padding:11px 14px;
  border: 2px solid var(--rust); background: rgba(214,73,51,0.08);
  font-family: 'Noto Sans TC', sans-serif;
  font-size:12px; color: var(--rust);
}

/* ── RWD ── */
@media (max-width: 360px) {
  .p-name { letter-spacing: -0.02em; }
  .row-sub { letter-spacing: 0.10em; }
  .foot { padding: 12px 16px; font-size: 8.5px; letter-spacing: 0.14em; }
}
@media (min-width: 481px) {
  .wrap { max-width: 400px; }
}
@media (hover: none) {
  .row:hover { background: transparent; }
  .row:active { background: rgba(36,33,28,0.08); }
}
</style>
</head>
<body>

<div class="wrap">

  <!-- COLOR BAND -->
  <div class="band">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span>
  </div>

  <!-- PROFILE -->
  <div class="profile">
    <div class="avatar">
      <img src="https://yt3.googleusercontent.com/c0PfYv45N-hiB1GGmtlB0oc2f8qPB7i2OMU018Un5zVu0ZyFPvu2X6gCO6itzygg9kUZNONIiw=s160-c-k-c0x00ffffff-no-rj" alt="Ocean & Yvonne" />
    </div>
    <div class="p-text">
      <div class="p-name">Ocean &amp;<br>Yvonne</div>
      <div class="p-bio">收集旅途中的不期而遇，<br>與那些剛好很好吃的蔬食日常</div>
    </div>
  </div>

  <!-- ROWS -->
  <div class="rows">

    <a href="https://www.youtube.com/@YvonneandOcean" target="_blank" class="row">
      <div class="row-swatch sw-red">
        <svg viewBox="0 0 24 18" fill="none"><path d="M9.6 12l5.8-3.5L9.6 5v7z" fill="#F7F5F0"/><rect x="1" y="1" width="22" height="16" rx="3" stroke="#F7F5F0" stroke-width="1.6"/></svg>
      </div>
      <div class="row-main">
        <div class="row-title">YouTube 頻道</div>
        <div class="row-sub">Subscribe</div>
      </div>
      <div class="row-arrow">↗</div>
    </a>

    <button class="row" onclick="openSheet('iceland')">
      <div class="row-swatch sw-blue">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 20l5-9 4 5 3-5 6 9H3z" stroke="#F7F5F0" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <div class="row-main">
        <div class="row-title">冰島住宿攻略</div>
        <div class="row-sub">Iceland</div>
      </div>
      <div class="row-arrow">→</div>
    </button>

    <button class="row" onclick="openSheet('lofoten')">
      <div class="row-swatch sw-sage">
        <svg viewBox="0 0 24 24" fill="none"><path d="M2 19c3-3 6-5 10-5s7 2 10 5" stroke="#F7F5F0" stroke-width="1.8" stroke-linecap="round"/><path d="M5 13c2-2 4-4 7-4s5 2 7 4" stroke="#F7F5F0" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="row-main">
        <div class="row-title">羅弗敦景點攻略</div>
        <div class="row-sub">Lofoten</div>
      </div>
      <div class="row-arrow">→</div>
    </button>

    <button class="row" onclick="openSheet('copenhagen')">
      <div class="row-swatch sw-yellow">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" stroke="#24211C" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#24211C" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="row-main">
        <div class="row-title">哥本哈根行程表</div>
        <div class="row-sub">Copenhagen</div>
      </div>
      <div class="row-arrow">→</div>
    </button>

    <button class="row" onclick="openSheet('stockholm')">
      <div class="row-swatch sw-ink">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 21V9l8-6 8 6v12" stroke="#F7F5F0" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 21v-6h6v6" stroke="#F7F5F0" stroke-width="1.8"/></svg>
      </div>
      <div class="row-main">
        <div class="row-title">斯德哥爾摩景點</div>
        <div class="row-sub">Stockholm</div>
      </div>
      <div class="row-arrow">→</div>
    </button>

    <button class="row" onclick="openSheet('contact')">
      <div class="row-swatch" style="background:#F7F5F0">
        <svg viewBox="0 0 24 20" fill="none"><rect x="2" y="2" width="20" height="16" stroke="#24211C" stroke-width="1.8"/><path d="M2 4l10 7 10-7" stroke="#24211C" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="row-main">
        <div class="row-title">留言給我們</div>
        <div class="row-sub">Contact</div>
      </div>
      <div class="row-arrow">→</div>
    </button>

  </div>

  <!-- FOOTER -->
  <div class="foot">
    <span>© 2026 O&amp;Y</span>
    <span class="foot-dots"><i class="fd1"></i><i class="fd2"></i><i class="fd3"></i></span>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="overlayClick(event)">
  <div class="modal-sheet">
    <div class="sheet-band">
      <span style="background:#B5573C"></span><span style="background:#C99B3F"></span>
      <span style="background:#3E5C6B"></span><span style="background:#6E7F63"></span>
    </div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheetTitle"></div>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
const CONTACT_URL = "https://script.google.com/macros/s/AKfycbzWwtTkl-BvP8DUinm9R92WEx9yoPNG8iZRUgiTXe0WZYMEK_FAvXkpYPXohLFeot19/exec";

const FORMS = {
  iceland:    { title:'冰島住宿攻略',   guide:'冰島住宿',    desc:'填寫資料後，我們會把整理好的冰島各地區住宿推薦與訂房眉角寄給你，完全免費。', msgRequired:false, submitLabel:'送出申請' },
  lofoten:    { title:'羅弗敦景點攻略', guide:'羅弗敦景點',  desc:'填寫資料後，我們把羅弗敦必去景點與隱藏版路線整理好寄給你，完全免費。',   msgRequired:false, submitLabel:'送出申請' },
  copenhagen: { title:'哥本哈根行程表', guide:'哥本哈根行程', desc:'填寫資料後，我們把哥本哈根行程表整理好寄給你，完全免費。',             msgRequired:false, submitLabel:'送出申請' },
  stockholm:  { title:'斯德哥爾摩景點', guide:'斯德哥爾摩景點', desc:'填寫資料後，我們把斯德哥爾摩必去景點與路線整理好寄給你，完全免費。',   msgRequired:false, submitLabel:'送出申請' },
  contact:    { title:'留言給我們',     guide:'留言',        desc:'合作邀請、旅遊問題、或任何想說的話都歡迎。',                              msgRequired:true,  submitLabel:'送出留言' }
};

function buildSuccess(type) {
  const yt = 'https://www.youtube.com/@YvonneandOcean';
  if (type === 'contact') {
    return `<span class="s-icon">✉</span><span class="s-title">留言已送出</span><p class="s-body">感謝你的訊息，我們看到後會盡快回覆。</p><a href="${yt}" target="_blank" class="s-yt-btn">前往 YouTube 頻道 <span>↗</span></a>`;
  }
  return `<span class="s-icon">📬</span><span class="s-title">最後一步</span><p class="s-body">我們收到你的申請了。請到 YouTube 頻道任一支影片下方留言「<strong style="color:#B5573C;">我要攻略</strong>」，我們看到後就會把攻略寄給你。</p><a href="${yt}" target="_blank" class="s-yt-btn">前往 YouTube 留言 <span>↗</span></a><p class="s-note">留言讓我們確認你有在追蹤，也方便找到你。</p>`;
}

function buildForm(type) {
  const f = FORMS[type];
  let h = `<p class="form-desc">${f.desc}</p>`;
  h += `<div class="form-row"><label class="form-label">名字 / Name</label><input class="form-input" type="text" id="f_name" placeholder="Yvonne"/></div>`;
  h += `<div class="form-row"><label class="form-label">Email *</label><input class="form-input" type="email" id="f_email" placeholder="your@email.com"/></div>`;
  const ml = f.msgRequired ? '留言內容 *' : '想問的問題（選填）';
  h += `<div class="form-row"><label class="form-label">${ml}</label><textarea class="form-input" id="f_msg" placeholder="有什麼想問的都可以寫在這裡…" style="min-height:${f.msgRequired?'110px':'72px'}"></textarea></div>`;
  h += `<button class="submit-btn" id="sheetSubmitBtn" onclick="submitSheet('${type}')">${f.submitLabel}</button>`;
  if (type !== 'contact') h += `<p class="form-note">送出後到 YouTube 影片留言「我要攻略」，我們看到就寄</p>`;
  h += `<div class="sheet-success" id="sheetSuccess">${buildSuccess(type)}</div>`;
  h += `<div class="sheet-error" id="sheetError">出了點問題，請稍後再試。</div>`;
  return h;
}

function openSheet(type) {
  document.getElementById('sheetTitle').textContent = FORMS[type].title;
  document.getElementById('sheetBody').innerHTML = buildForm(type);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function overlayClick(e) { if (e.target === document.getElementById('modalOverlay')) closeSheet(); }

async function submitSheet(type) {
  const name  = (document.getElementById('f_name')?.value || '').trim();
  const email = (document.getElementById('f_email')?.value || '').trim();
  const msg   = (document.getElementById('f_msg')?.value || '').trim();
  const btn = document.getElementById('sheetSubmitBtn');
  const success = document.getElementById('sheetSuccess');
  const error = document.getElementById('sheetError');
  const emailEl = document.getElementById('f_email');

  if (!email || !email.includes('@')) {
    emailEl.style.borderColor = '#B5573C'; emailEl.focus();
    setTimeout(() => { emailEl.style.borderColor = ''; }, 1500); return;
  }
  if (FORMS[type].msgRequired && !msg) {
    const m = document.getElementById('f_msg');
    m.style.borderColor = '#B5573C'; m.focus();
    setTimeout(() => { m.style.borderColor = ''; }, 1500); return;
  }
  btn.disabled = true; btn.textContent = '送出中…'; error.style.display = 'none';
  try {
    await fetch(CONTACT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, guide: FORMS[type].guide, name, email, message: msg, timestamp: new Date().toISOString() })
    });
    btn.style.display = 'none';
    const note = document.querySelector('.form-note');
    if (note) note.style.display = 'none';
    success.style.display = 'block';
    success.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch {
    btn.disabled = false; btn.textContent = FORMS[type].submitLabel;
    error.style.display = 'block';
  }
}
</script>
</body>
</html>
