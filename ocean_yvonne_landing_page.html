<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean & Yvonne</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sage: #7A9E7E;
    --sage-light: #EEF4EF;
    --sand: #F5F0E8;
    --stone: #3D3830;
    --mist: #8B8680;
    --ice: #C8DCE8;
    --ice-light: #EBF3F8;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--sand);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .page {
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
  }

  .avatar-ring {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--sage) 0%, var(--ice) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.25rem;
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: white;
    letter-spacing: -1px;
  }

  .handle {
    text-align: center;
    font-size: 13px;
    color: var(--mist);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--stone);
    text-align: center;
    margin-bottom: 0.5rem;
    line-height: 1.2;
  }

  .tagline {
    text-align: center;
    font-size: 14px;
    color: var(--mist);
    font-weight: 300;
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  .tags {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2rem;
  }

  .tag {
    background: white;
    border: 1px solid #E0D9CE;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--stone);
    font-weight: 400;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 2rem;
  }

  .link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.15s, opacity 0.15s;
    cursor: pointer;
    border: none;
    width: 100%;
    text-align: left;
  }

  .link-btn:hover { transform: translateY(-1px); opacity: 0.92; }
  .link-btn:active { transform: scale(0.98); }

  .link-btn .icon { font-size: 18px; }
  .link-btn .arrow { font-size: 16px; opacity: 0.6; }

  .btn-yt { background: #FF4444; color: white; }
  .btn-ig { background: linear-gradient(135deg, #833AB4, #E1306C, #FD1D1D); color: white; }
  .btn-sage { background: var(--sage); color: white; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1.5rem 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #DDD5C8;
  }
  .divider span {
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .email-box {
    background: white;
    border: 1px solid #E0D9CE;
    border-radius: 16px;
    padding: 1.5rem;
  }

  .email-box h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--stone);
    margin-bottom: 6px;
  }

  .email-box p {
    font-size: 13px;
    color: var(--mist);
    margin-bottom: 1rem;
    line-height: 1.5;
  }

  .email-row {
    display: flex;
    gap: 8px;
  }

  .email-row input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #DDD5C8;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--stone);
    background: var(--sand);
    outline: none;
    transition: border-color 0.15s;
  }

  .email-row input:focus { border-color: var(--sage); }
  .email-row input::placeholder { color: #BFB8AF; }

  .email-row button {
    background: var(--stone);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }

  .email-row button:hover { background: var(--sage); }

  .success-msg {
    display: none;
    text-align: center;
    padding: 12px;
    background: var(--sage-light);
    border-radius: 8px;
    font-size: 13px;
    color: var(--sage);
    margin-top: 10px;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: #C5BFBA;
    margin-top: 2rem;
  }

  .dots {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-sage { background: var(--sage); }
  .dot-ice { background: var(--ice); }
  .dot-sand { background: #C5BFBA; }
</style>
</head>
<body>
<div class="page">
  <div class="dots">
    <div class="dot dot-sage"></div>
    <div class="dot dot-ice"></div>
    <div class="dot dot-sand"></div>
  </div>

  <div class="avatar-ring">O&Y</div>

  <p class="handle">@YvonneandOcean</p>
  <h1>在旅行中找好吃蔬食的人</h1>
  <p class="tagline">冰島公路旅行 · 台灣蔬食探店<br>每週一、四更新</p>

  <div class="tags">
    <span class="tag">✈️ 旅遊 Vlog</span>
    <span class="tag">🌱 蔬食探店</span>
    <span class="tag">❄️ 冰島</span>
    <span class="tag">🇹🇼 台灣</span>
  </div>

  <div class="links">
    <a class="link-btn btn-yt" href="https://www.youtube.com/@YvonneandOcean" target="_blank">
      <span>▶ YouTube 頻道</span>
      <span class="arrow">→</span>
    </a>
    <a class="link-btn btn-ig" href="https://www.instagram.com/" target="_blank">
      <span>◎ Instagram</span>
      <span class="arrow">→</span>
    </a>
    <a class="link-btn btn-sage" href="https://www.youtube.com/@YvonneandOcean" target="_blank">
      <span>🗺 冰島蔬食地圖（最新系列）</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="divider"><span>加入旅人小圈圈</span></div>

  <div class="email-box">
    <h2>蔬食旅遊小報 🌿</h2>
    <p>不定期分享旅途中的蔬食秘境、訂閱者限定行程攻略，不塞垃圾廣告。</p>
    <div class="email-row">
      <input type="email" id="emailInput" placeholder="your@email.com" />
      <button onclick="handleSubmit()">訂閱</button>
    </div>
    <div class="success-msg" id="successMsg">🎉 收到！下次分享時會通知你～</div>
  </div>

  <p class="footer">© Ocean & Yvonne · 蔬食旅人</p>
</div>

<script>
function handleSubmit() {
  const input = document.getElementById('emailInput');
  const msg = document.getElementById('successMsg');
  if (!input.value || !input.value.includes('@')) {
    input.style.borderColor = '#E24B4A';
    setTimeout(() => input.style.borderColor = '', 1000);
    return;
  }
  input.style.display = 'none';
  document.querySelector('.email-row button').style.display = 'none';
  msg.style.display = 'block';
}
</script>
</body>
</html>
